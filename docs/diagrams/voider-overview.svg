<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1810" viewBox="0 0 1600 1810" role="img" aria-labelledby="title desc">
  <title id="title">Voider: pair, connect, verify, call</title>
  <desc id="desc">Source-based overview. Each appliance installs 253 client-role accounts vmc002 through vmc254 and 253 server-role accounts vms002 through vms254. Role plus slot selects a separate key and RAM-backed chroot. Current remote CAP2 exchanges use the authorized client-role mailbox: the server-role peer sends OFFER and READY into in, and reads ANSWER from out over authenticated SFTP through Tor. Server-role mailbox accounts are installed but have no incoming authorized keys in the current setup. Records share a transaction ID, are HMAC authenticated, atomically published, and bounded. Call path selection tries LAN WireGuard, direct WireGuard, UDP hole punch, then Tor fallback. A healthy selected path is retained. Each imported server contact has an isolated network namespace; the phone reaches it through a per-slot veth link and stateless SIP rewriting. WireGuard UDP sockets remain in the default namespace. Both appliances require the PiTFT display and four buttons. Automatic BOOT and SYSTEM verification plus a human comparison of the STATE fingerprint gate calling. USB pairing exports a client certificate index and imports it into an independently chosen server slot; trusted USB handoff, validation, and saving curated STATE precede activation.</desc>
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; fill: #dcece4; }
      .title { font-family: 'DejaVu Sans Mono', monospace; font-size: 48px; font-weight: bold; fill: #a0ffb2; }
      .heading { font-family: 'DejaVu Sans Mono', monospace; font-size: 28px; font-weight: bold; fill: #a0ffb2; }
      .label { font-size: 25px; font-weight: bold; }
      .body { font-size: 22px; }
      .code { font-family: 'DejaVu Sans Mono', monospace; font-size: 20px; }
      .small { font-size: 19px; fill: #9eb5ab; }
      .cyan { fill: #6de3e6; }
      .green { fill: #a0ffb2; }
      .amber { fill: #f6d568; }
      .red { fill: #ff8e94; }
      .panel { fill: #0e1b18; stroke: #335b4c; stroke-width: 2; }
      .cell { fill: #12251f; stroke: #42725f; stroke-width: 2; }
      .control { fill: none; stroke: #6de3e6; stroke-width: 3; marker-end: url(#cyan-arrow); }
      .call { fill: none; stroke: #a0ffb2; stroke-width: 4; marker-end: url(#green-arrow); }
      .icon { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#163329" stroke-width="0.6"/></pattern>
    <marker id="cyan-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#6de3e6"/></marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#a0ffb2"/></marker>
    <symbol id="lock" viewBox="0 0 64 64"><g class="icon"><path d="M20 27V18a12 12 0 0 1 24 0v9"/><rect x="12" y="27" width="40" height="30" rx="3"/><path d="M32 38v8"/></g></symbol>
    <symbol id="phone" viewBox="0 0 80 80"><g class="icon"><rect x="10" y="26" width="60" height="43" rx="4"/><path d="M16 22v-7q24-14 48 0v7l-14 2v-8H30v8Z"/><rect x="21" y="36" width="23" height="13"/><path d="M53 38h6M53 47h6M24 59h4m10 0h4m10 0h4"/></g></symbol>
    <symbol id="device" viewBox="0 0 100 85"><g class="icon"><rect x="8" y="7" width="84" height="70" rx="4"/><rect x="18" y="17" width="64" height="36" rx="2"/><circle cx="22" cy="65" r="3"/><circle cx="40" cy="65" r="3"/><circle cx="58" cy="65" r="3"/><circle cx="76" cy="65" r="3"/></g></symbol>
    <symbol id="usb" viewBox="0 0 64 90"><g class="icon"><rect x="18" y="4" width="28" height="25"/><path d="M27 11v9m10-9v9"/><rect x="12" y="29" width="40" height="54" rx="5"/><path d="M32 42v27m-8-18 8-9 8 9m-8 7 9 5"/></g></symbol>
    <symbol id="document" viewBox="0 0 64 64"><g class="icon"><path d="M15 5h24l12 13v41H15Z M39 5v13h12 M24 30h18m-18 10h18m-18 10h12"/></g></symbol>
    <symbol id="check" viewBox="0 0 64 64"><g class="icon"><circle cx="32" cy="32" r="26"/><path d="m18 32 10 10 19-21"/></g></symbol>
  </defs>
  <rect width="1600" height="1810" fill="#07100d"/>
  <rect width="1600" height="1810" fill="url(#grid)"/>
  <path d="M40 28h10v66H40" fill="#a0ffb2"/>
  <text x="70" y="68" class="title">VOIDER</text>
  <text x="345" y="64" class="heading">PRIVATE PHONE-TO-PHONE CALLING</text>
  <text x="70" y="103" class="body">Raspberry Pi · Alpine Linux · a physical display on both ends</text>
  <text x="1560" y="101" text-anchor="end" class="code cyan">PAIR → CONNECT → VERIFY → CALL</text>

  <!-- Installed mailbox structure and the actual remote exchange are distinct. -->
  <text x="40" y="157" class="heading">01 / MAILBOXES: A PRIVATE HANDSHAKE FOR EACH PAIR</text>
  <rect x="40" y="181" width="1520" height="472" rx="6" class="panel"/>
  <text x="64" y="220" class="label">506 fixed accounts per appliance</text>
  <text x="1535" y="219" text-anchor="end" class="body cyan">ROLE + SLOT = separate account / key / chroot</text>
  <rect x="64" y="244" width="710" height="122" rx="4" class="cell"/>
  <rect x="794" y="244" width="742" height="122" rx="4" class="cell"/>
  <use href="#lock" x="81" y="258" width="48" height="48" color="#6de3e6"/>
  <text x="146" y="278" class="label cyan">CLIENT ROLE · 253 accounts</text>
  <text x="146" y="311" class="code">vmc002 … vmc254</text>
  <text x="86" y="346" class="code">/var/sftp/clients/vmbNNN</text>
  <use href="#lock" x="811" y="258" width="48" height="48" color="#f6d568"/>
  <text x="876" y="278" class="label amber">SERVER ROLE · 253 accounts</text>
  <text x="876" y="311" class="code">vms002 … vms254</text>
  <text x="816" y="346" class="code">/var/sftp/servers/vmbNNN</text>
  <text x="64" y="398" class="small">Separate public-key paths: /etc/voider/certs/mailboxes/%u.authorized_keys</text>
  <text x="64" y="428" class="small amber">Current incoming CAP2 uses vmcNNN. vmsNNN is installed without an incoming authorized key.</text>

  <rect x="64" y="452" width="300" height="120" rx="4" class="cell"/>
  <use href="#device" x="80" y="468" width="76" height="65" color="#6de3e6"/>
  <text x="171" y="483" class="label">Paired peer</text>
  <text x="171" y="516" class="body cyan">server role</text>
  <text x="82" y="551" class="small">SFTP over Tor · key only</text>
  <rect x="1040" y="452" width="496" height="120" rx="4" class="cell"/>
  <text x="1060" y="482" class="label">Client-role mailbox: vmc007</text>
  <text x="1060" y="517" class="code cyan">in/  XID.offer + XID.ready</text>
  <text x="1060" y="551" class="code green">out/ XID.answer</text>
  <path d="M364 484H1030" class="control"/>
  <text x="700" y="476" text-anchor="middle" class="body cyan">1 OFFER + 3 READY · write /in</text>
  <path d="M1040 541H374" class="control"/>
  <text x="700" y="532" text-anchor="middle" class="body cyan">2 ANSWER · read /out · same XID</text>
  <text x="64" y="610" class="code green">SYSTEM: accounts</text>
  <text x="410" y="610" class="code amber">STATE: pairing keys</text>
  <text x="795" y="610" class="code cyan">RAM: mailbox records</text>
  <text x="1535" y="610" text-anchor="end" class="small green">HMAC checked · atomic publish</text>
  <text x="1535" y="638" text-anchor="end" class="small">Limits: 4 KiB / record · 8 pending exchanges / mailbox · 10 min record TTL</text>

  <!-- Path choice is a ladder; a healthy connection does not restart it. -->
  <text x="40" y="701" class="heading">02 / CONNECT: ONE SELECTED PATH CARRIES THE CALL</text>
  <rect x="40" y="724" width="1520" height="449" rx="6" class="panel"/>
  <use href="#phone" x="66" y="753" width="80" height="80" color="#a0ffb2"/>
  <text x="106" y="861" text-anchor="middle" class="body">Phone A</text>
  <path d="M156 796H211" class="call"/>
  <use href="#device" x="224" y="751" width="100" height="85" color="#a0ffb2"/>
  <text x="274" y="861" text-anchor="middle" class="body">Voider A</text>
  <path d="M335 796H402" class="call"/>
  <rect x="405" y="745" width="832" height="125" rx="5" fill="none" stroke="#42725f" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="416" y="756" width="177" height="83" rx="4" class="cell"/>
  <text x="505" y="786" text-anchor="middle" class="label green">1 / LAN</text>
  <text x="505" y="818" text-anchor="middle" class="body">WireGuard</text>
  <path d="M598 796H622" class="control"/>
  <rect x="635" y="756" width="177" height="83" rx="4" class="cell"/>
  <text x="724" y="786" text-anchor="middle" class="label green">2 / DIRECT</text>
  <text x="724" y="818" text-anchor="middle" class="body">WireGuard</text>
  <path d="M817 796H841" class="control"/>
  <rect x="854" y="756" width="177" height="83" rx="4" class="cell"/>
  <text x="943" y="786" text-anchor="middle" class="label green">3 / PUNCH</text>
  <text x="943" y="818" text-anchor="middle" class="body">WireGuard</text>
  <path d="M1036 796H1060" class="control"/>
  <rect x="1073" y="756" width="151" height="83" rx="4" class="cell"/>
  <text x="1149" y="786" text-anchor="middle" class="label cyan">4 / TOR</text>
  <text x="1149" y="818" text-anchor="middle" class="body">fallback</text>
  <path d="M1233 796H1268" class="call"/>
  <use href="#device" x="1281" y="751" width="100" height="85" color="#a0ffb2"/>
  <text x="1331" y="861" text-anchor="middle" class="body">Voider B</text>
  <path d="M1390 796H1440" class="call"/>
  <use href="#phone" x="1454" y="753" width="80" height="80" color="#a0ffb2"/>
  <text x="1494" y="861" text-anchor="middle" class="body">Phone B</text>
  <text x="820" y="863" text-anchor="middle" class="small green">SELECT ONE</text>
  <text x="800" y="902" text-anchor="middle" class="small">Move right only if a path is unavailable or fails · keep a healthy selection</text>

  <rect x="64" y="922" width="920" height="222" rx="4" class="cell"/>
  <text x="84" y="954" class="label">Inside each appliance</text>
  <text x="84" y="990" class="code">eth1 · phone</text>
  <text x="84" y="1019" class="small">172.16.19.85</text>
  <path d="M250 1000H300" class="control"/>
  <rect x="314" y="974" width="260" height="69" rx="3" class="panel"/>
  <text x="444" y="1003" text-anchor="middle" class="body">SIP rewrite / vethX</text>
  <text x="444" y="1030" text-anchor="middle" class="small">one link per imported slot</text>
  <path d="M579 1007H623" class="control"/>
  <rect x="637" y="974" width="319" height="69" rx="3" class="panel"/>
  <text x="796" y="1003" text-anchor="middle" class="code green">netnsX / wgX</text>
  <text x="796" y="1030" text-anchor="middle" class="small">isolated contact tunnel</text>
  <text x="84" y="1082" class="code">wg0: shared listener · UDP sockets → eth0 uplink</text>
  <text x="84" y="1119" class="small">wgX moves into netnsX; its UDP socket stays in the default namespace.</text>
  <rect x="1008" y="922" width="528" height="222" rx="4" class="cell"/>
  <text x="1032" y="954" class="label green">Prove → keep → recover</text>
  <use href="#check" x="1032" y="975" width="52" height="52" color="#a0ffb2"/>
  <text x="1101" y="992" class="body">WG key + handshake + ping</text>
  <text x="1101" y="1023" class="small">or paired Tor proof → call route</text>
  <path d="M1035 1057H1507" stroke="#335b4c" stroke-width="2"/>
  <text x="1032" y="1092" class="body green">Healthy? Keep the selected path.</text>
  <text x="1032" y="1124" class="small">Failure, removal or disable → select again.</text>

  <!-- The integrity gate has both an automatic and a human input. -->
  <text x="40" y="1221" class="heading">03 / VERIFY: TWO CHECKS BEFORE CALLING</text>
  <rect x="40" y="1244" width="1520" height="232" rx="6" class="panel"/>
  <rect x="64" y="1268" width="344" height="132" rx="4" class="cell"/>
  <use href="#lock" x="83" y="1283" width="56" height="56" color="#a0ffb2"/>
  <text x="155" y="1305" class="label green">BOOT + SYSTEM</text>
  <text x="155" y="1338" class="body">Read-only partitions</text>
  <text x="84" y="1377" class="small">Checks raw SHA-256 hashes.</text>
  <path d="M414 1333H461" class="call"/>
  <rect x="475" y="1268" width="416" height="132" rx="4" class="cell"/>
  <use href="#document" x="492" y="1281" width="56" height="56" color="#f6d568"/>
  <text x="566" y="1305" class="label amber">YOU CHECK STATE</text>
  <text x="566" y="1338" class="body">Panel ↔ trusted record</text>
  <text x="495" y="1377" class="small">Compare or record the fingerprint.</text>
  <path d="M897 1333H944" class="call"/>
  <rect x="958" y="1268" width="256" height="132" rx="4" class="cell"/>
  <use href="#check" x="979" y="1280" width="52" height="52" color="#a0ffb2"/>
  <text x="1047" y="1309" class="label green">BOTH PASS</text>
  <text x="983" y="1372" class="label green">Calls enabled</text>
  <use href="#device" x="1284" y="1262" width="145" height="123" color="#6de3e6"/>
  <text x="1376" y="1417" text-anchor="middle" class="body cyan">PiTFT 2.2″ · four buttons</text>
  <text x="1376" y="1447" text-anchor="middle" class="small">Required on both appliances</text>
  <text x="64" y="1445" class="body red">Mismatch → calls stay off</text>
  <text x="455" y="1445" class="small">Curated STATE loads into RAM after the device check.</text>

  <!-- USB pairing demonstrates independent local and certificate indexes. -->
  <text x="40" y="1524" class="heading">04 / PAIR: TRUSTED USB HANDOFF, THEN SAVE</text>
  <rect x="40" y="1547" width="1520" height="223" rx="6" class="panel"/>
  <use href="#device" x="69" y="1569" width="100" height="85" color="#a0ffb2"/>
  <text x="192" y="1599" class="label">Export client</text>
  <text x="192" y="1635" class="code green">certificate s = 7</text>
  <path d="M423 1614H473" class="control"/>
  <use href="#usb" x="491" y="1562" width="64" height="90" color="#6de3e6"/>
  <path d="M570 1614H620" class="control"/>
  <rect x="634" y="1570" width="274" height="92" rx="4" class="cell"/>
  <text x="771" y="1604" text-anchor="middle" class="label cyan">Validate in RAM</text>
  <text x="771" y="1640" text-anchor="middle" class="body">hash / format / identity</text>
  <path d="M915 1614H956" class="control"/>
  <use href="#device" x="968" y="1569" width="100" height="85" color="#a0ffb2"/>
  <text x="1089" y="1599" class="label">Import server</text>
  <text x="1089" y="1635" class="code amber">local X = 42 · remote s = 7</text>
  <text x="64" y="1701" class="body">WG / SFTP keys + pair secret</text>
  <text x="635" y="1701" class="body cyan">Trusted handoff → verify → save STATE → activate</text>
  <text x="64" y="1742" class="small">A checksum checks the copy, not the sender. Keep the USB bundle private.</text>
  <text x="1535" y="1742" text-anchor="end" class="code amber">X and s are independent</text>
  <text x="40" y="1798" class="small">Cyan: setup / control · Green: call path / verified · Amber: your trust decision</text>
  <text x="1560" y="1798" text-anchor="end" class="small">Source schematic · indexes shown as examples</text>
</svg>
