# Tundup authenticates plaintext over two isolated Tor streams; Tor encrypts.
MAX_CLIENTS=253
MAX_SERVERS=253
MAX_PEERS=506


USB_LABEL=VOIDER
USB_MOUNT=/run/voider/usb-mount
USB_BUNDLE=voider-bundle.tar
USB_FS=vfat
USB_FINGERPRINT_DIR=/etc/voider/certs/fingerprints
USB_IMPORT_DIR=/etc/voider/imports


USB_REJECT_DIR=/etc/voider/certs/rejected


# BOOT/SYSTEM/STATE/RAM persistence and integrity model; no installed apkovl.
BOOT_DEVICE=AUTO
SYSTEM_DEVICE=AUTO
STATE_DEVICE=AUTO
STATE_MOUNT=/mnt/voider-state
STATE_DIR=/mnt/voider-state/voider
STATE_TAR=/mnt/voider-state/voider/state.tar.gz
INTEGRITY_MANIFEST=/mnt/voider-state/voider/integrity.manifest
INTEGRITY_FREEZE_META=/mnt/voider-state/voider/integrity.freeze.meta
RAM_STATE_ROOT=/run/voider/state-root
RAM_OVERLAY_ROOT=/run/voider/overlay-root
STATE_ALLOWLIST=/etc/voider/voider.conf,/etc/voider/peers,/etc/voider/private,/etc/voider/certs,/etc/voider/imports,/etc/voider/dhcp,/etc/voider/node,/var/lib/tor/voider,/etc/ssh/ssh_host_ed25519_key,/etc/ssh/ssh_host_ed25519_key.pub,/etc/ssh/ssh_host_rsa_key,/etc/ssh/ssh_host_rsa_key.pub,/etc/ssh/sshd_config.d/00-voider-mailboxes.conf,/etc/network/interfaces,/etc/hostname,/etc/machine-id
RUNTIME_ALLOWLIST=/etc/voider/sync,/var/sftp
# Ephemeral fake IP mapping, generated at boot, no mapping files
FAKEIP_SEED=/run/voider/fakeip.seed
FAKEIP_CLIENT_BASE3=40
FAKEIP_SERVER_BASE3=10
FAKEIP_WIDTH=10
FAKEIP_HOST_BASE=10


